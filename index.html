<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kaptron Plastics & Metals — high-precision CNC machining, tooling, mould manufacturing and value-added services.">
  <title>Kaptron Plastics & Metals | High-Precision Manufacturing</title>
  <link rel="icon" href="favicon1.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --ink: #14211f;
      --ink-soft: #46534f;
      --paper: #f7f7f3;
      --white: #fff;
      --line: #dfe4e0;
      --maroon: #811a24;
      --maroon-dark: #5c1018;
      --gold: #c89c58;
      --green: #1f4d43;
      --shadow: 0 18px 55px rgba(20, 33, 31, .10);
      --shadow-soft: 0 8px 28px rgba(20, 33, 31, .08);
      --radius: 1.25rem;
      --container: min(1180px, calc(100% - 3rem));
    }

    * { box-sizing: border-box; margin: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--paper); color: var(--ink); font-family: "Manrope", Arial, sans-serif; line-height: 1.65; overflow-x: hidden; }
    body.menu-open { overflow: hidden; }
    a { color: inherit; }
    button { font: inherit; }
    img { max-width: 100%; }
    .container { width: var(--container); margin-inline: auto; }
    .skip-link { position: fixed; left: 1rem; top: -5rem; z-index: 9999; background: var(--white); color: var(--ink); padding: .75rem 1rem; border-radius: .5rem; box-shadow: var(--shadow); font-weight: 800; }
    .skip-link:focus { top: 1rem; }

    .eyebrow { display: flex; align-items: center; gap: .65rem; color: var(--maroon); font: 700 .72rem/1 "DM Mono", monospace; letter-spacing: .12em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 2rem; height: 2px; background: currentColor; }
    .display, h1, h2, h3, h4 { font-family: "Oswald", Impact, sans-serif; letter-spacing: .01em; line-height: 1.08; text-transform: uppercase; }
    h2 { font-size: clamp(2rem, 4vw, 3.4rem); max-width: 16ch; }
    h3 { font-size: 1.25rem; }
    p { color: var(--ink-soft); }
    .section { padding: clamp(4.5rem, 9vw, 8rem) 0; }
    .section-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(16rem, .72fr); gap: 2rem; align-items: end; margin-bottom: clamp(2.4rem, 5vw, 4rem); }
    .section-head p { max-width: 37rem; font-size: 1.02rem; }
    .center-head { text-align: center; display: grid; justify-items: center; gap: 1rem; max-width: 49rem; margin: 0 auto clamp(2.5rem, 5vw, 4.25rem); }
    .center-head h2 { max-width: 20ch; }

    /* Header */
    .site-notice { background: var(--ink); color: #e6ebe8; font-size: .75rem; }
    .notice-inner { min-height: 2.4rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .notice-inner span { display: flex; align-items: center; gap: .5rem; }
    .notice-inner .fa-solid { color: var(--gold); }
    .notice-contacts { display: flex; gap: 1.25rem; }
    .notice-contacts a { text-decoration: none; }
    .notice-contacts a:hover { color: var(--gold); }
    .site-header { position: sticky; top: 0; z-index: 100; background: rgba(247, 247, 243, .92); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(20, 33, 31, .1); }
    .nav-wrap { height: 5.6rem; display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; }
    .brand { display: inline-flex; align-items: center; text-decoration: none; flex: 0 0 auto; }
    .brand img { display: block; width: auto; height: 3.25rem; object-fit: contain; }
    .brand-fallback { color: var(--ink); font: 700 1.5rem/1 "Oswald", sans-serif; letter-spacing: .04em; }
    .brand-fallback[hidden] { display: none; }
    .nav-list { align-items: center; display: flex; gap: clamp(.9rem, 2vw, 1.65rem); list-style: none; padding: 0; }
    .nav-list a { color: var(--ink); font-size: .74rem; font-weight: 800; letter-spacing: .09em; text-decoration: none; text-transform: uppercase; transition: color .2s ease; white-space: nowrap; }
    .nav-list a:not(.button):hover, .nav-list a.active { color: var(--maroon); }
    .menu-button { display: none; background: transparent; border: 0; color: var(--ink); cursor: pointer; font-size: 1.35rem; padding: .5rem; }
    .button { align-items: center; background: var(--maroon); border: 1px solid var(--maroon); color: var(--white); cursor: pointer; display: inline-flex; font: 800 .75rem/1 "Manrope", sans-serif; gap: .7rem; justify-content: center; letter-spacing: .09em; min-height: 3rem; padding: 0 1.15rem; text-decoration: none; text-transform: uppercase; transition: background .2s ease, border .2s ease, transform .2s ease; }
    .button:hover { background: var(--maroon-dark); border-color: var(--maroon-dark); transform: translateY(-2px); }
    .button--light { background: transparent; border-color: rgba(255,255,255,.6); }
    .button--light:hover { background: var(--white); border-color: var(--white); color: var(--ink); }
    .button--dark { background: var(--ink); border-color: var(--ink); }
    .button--dark:hover { background: var(--green); border-color: var(--green); }

    /* Page display */
    .content-section { display: none; animation: reveal .45s ease both; }
    .content-section.active { display: block; }
    @keyframes reveal { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    /* Hero */
    .hero { position: relative; min-height: min(760px, calc(100vh - 8rem)); display: grid; align-items: end; background: #192a27 url("https://images.unsplash.com/photo-1581093458791-9d42e3c9fc30?auto=format&fit=crop&w=2200&q=85") center/cover; color: var(--white); isolation: isolate; overflow: hidden; }
    .hero::before { background: linear-gradient(90deg, rgba(12,24,22,.92) 0%, rgba(12,24,22,.67) 48%, rgba(12,24,22,.25) 100%); content: ""; inset: 0; position: absolute; z-index: -1; }
    .hero::after { border: 1px solid rgba(255,255,255,.23); content: ""; height: min(35vw, 30rem); position: absolute; right: -9rem; top: -11rem; transform: rotate(45deg); width: min(35vw, 30rem); z-index: -1; }
    .hero-content { padding: clamp(5rem, 11vw, 9.5rem) 0 clamp(4rem, 8vw, 7rem); }
    .hero .eyebrow { color: #f1d3a3; }
    .hero h1 { color: var(--white); font-size: clamp(3.1rem, 7vw, 6.5rem); max-width: 11ch; margin: 1.1rem 0 1.35rem; }
    .hero-copy { color: rgba(255,255,255,.82); font-size: clamp(1rem, 1.8vw, 1.18rem); max-width: 37rem; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: .8rem; margin-top: 2rem; }
    .hero-foot { border-top: 1px solid rgba(255,255,255,.25); display: grid; grid-template-columns: repeat(3, 1fr); margin-top: clamp(4rem, 8vw, 7rem); max-width: 52rem; }
    .hero-stat { border-right: 1px solid rgba(255,255,255,.25); padding: 1rem 1.2rem 0 0; }
    .hero-stat + .hero-stat { padding-left: 1.2rem; }
    .hero-stat:last-child { border: 0; }
    .hero-stat strong { display: block; font: 600 clamp(1.45rem, 3vw, 2.1rem)/1 "Oswald", sans-serif; letter-spacing: .02em; }
